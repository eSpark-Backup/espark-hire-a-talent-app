name: eSpark Environment
on:
  push:
    branches:
      - dev

jobs: 
  deploy: 
    runs-on: ubuntu-latest
    steps:
      - if: github.ref == 'refs/heads/dev'
        name: espark-talent
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_PRIVATE_KEY }}
          script: |
            #sudo su
            #cd
            cd /var/www/eSpark-Hire-A-Talent-App/
            ls
            #git branch
            #git pull origin dev
            /root/.nvm/versions/node/v18.13.0/bin/npm install --legacy-peer-deps
            /root/.nvm/versions/node/v18.13.0/bin/npm run build
            pm2 ls
            cd
            pm2 restart 0
